name: restore-source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: hashFiles('.restore/part-000') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack source
        run: |
          python3 << 'PY'
          import pathlib, base64, tarfile, io, sys
          root = pathlib.Path(".restore")
          parts = sorted(p for p in root.iterdir() if p.name.startswith("part-"))
          if len(parts) != 65:
              sys.exit(f"expected 65 parts, got {len(parts)}")
          raw = "".join(p.read_text().strip() for p in parts)
          data = base64.b64decode(raw)
          tarfile.open(fileobj=io.BytesIO(data), mode="r:gz").extractall(".")
          print("unpacked", len(data))
          PY
      - name: Commit unpacked source
        run: |
          git config user.name "zhangevrieveri-create"
          git config user.email "243698272+zhangevrieveri-create@users.noreply.github.com"
          git rm -r .restore .github/workflows/restore-source.yml
          git add -A
          git commit -m "星詞突擊目前可玩版本的完整原始碼"
          git push origin HEAD:main
